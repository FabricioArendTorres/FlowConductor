[tool.ruff]
# Enable autofixing (use `ruff check --fix` to apply)
fix = true  

# Set the line length to match Black (if used)
line-length = 88  

# Target Python version
target-version = "py310"  # Adjust based on your project's Python version

# Enable select rulesets (common choices: `E`, `F`, `I`, `B`)
select = [
  "E",  # Pyflakes (errors)
  "F",  # Pyflakes (warnings)
  "W",  # Pycodestyle warnings
  "I",  # isort (import sorting)
  "B",  # flake8-bugbear (common pitfalls)
  "C90", # McCabe complexity (cyclomatic complexity)
  "UP", # pyupgrade (suggests modern Python)
  "SIM", # flake8-simplify (suggests simpler patterns)
  "PERF", # Perflint (performance improvements)
]

# Exclude files or directories
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
  "migrations"
]

# Ignore specific rules if necessary
ignore = [
  "E501",  # Ignore line length violations (if using Black)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow `assert` in test files

[tool.ruff.format]
# Enable Ruff's formatter (if not using Black)
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[mypy]
python_version = 3.9  # Adjust based on your Python version

# Core settings
disallow_untyped_defs = True  # Enforce type hints for all functions
disallow_untyped_calls = False  # Allow calls to untyped functions (useful for PyTorch ops)
warn_return_any = True  # Warn when a function returns `Any`
warn_unused_ignores = True  # Ensure `# type: ignore` is necessary
strict_equality = True  # Disallow `==` between incompatible types

# Allow dynamically typed attributes in classes (useful for PyTorch models)
allow_untyped_globals = False
allow_redefinition = True  # Common in PyTorch training loops

# PyTorch-specific considerations
[mypy-torch.*]
ignore_missing_imports = True  # Avoid issues with missing type hints in PyTorch

[mypy-torchvision.*]
ignore_missing_imports = True  # For torchvision modules

[mypy-torch.nn.*]
disallow_untyped_calls = False  # Allow calling PyTorch layers without full type annotations
