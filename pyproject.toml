[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowcon"
version = "1.0.0"
description = "Normalizing flows in PyTorch. An extension of nflows."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [
    { name = "Fabricio Arend Torres" },
    { name = "Marcello Massimo Negri" },
    { name = "Jonathan Aellen" },
]
keywords = ["normalizing-flows", "pytorch", "deep-learning", "density-estimation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "numpy",
    "torch>=2",
    "ninja",
    "h5py",
    "umnn",
    "einops",
    "torchdiffeq",
]

[project.optional-dependencies]
dev = [
    "parameterized",
    "pre-commit",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "torchtestcase",
]
examples = [
    "matplotlib",
    "pandas",
    "scikit-learn",
]
docs = [
    "pdoc3",
]
all = [
    "flowcon[dev,examples,docs]",
]

[project.urls]
Homepage = "https://github.com/FabricioArendTorres/FlowConductor"
Repository = "https://github.com/FabricioArendTorres/FlowConductor"
Issues = "https://github.com/FabricioArendTorres/FlowConductor/issues"

[dependency-groups]
dev = [
    "parameterized",
    "pre-commit",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "torchtestcase",
]

[tool.hatch.build.targets.wheel]
packages = ["flowcon"]

[tool.hatch.build.targets.sdist]
include = [
    "/flowcon",
    "/tests",
    "/README.md",
    "/LICENSE.md",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
# High-signal rules that are currently clean. Broader style (I/UP/B/F401) and
# ruff format belong in a later cleanup commit.
select = [
    "E9",  # runtime / syntax errors
    "F63", # assertion issues
    "F7",  # statement syntax
    "F82", # undefined names
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["flowcon"]

[tool.pyrefly]
python-version = "3.11"
project-includes = ["flowcon"]
project-excludes = [
    "tests/**",
    "examples/**",
    "**/__pycache__/**",
]
search-path = ["."]
# High-confidence diagnostics only while the codebase is still partially typed.
preset = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "expensive: long-running tests skipped in the default suite",
]

[tool.coverage.run]
source = ["flowcon"]
branch = true
omit = [
    "tests/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
skip_empty = true
