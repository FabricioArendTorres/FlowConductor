name: Build, lint, and run tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ruff
        run: uvx ruff@0.16.5 check flowcon tests examples

      - name: Pyrefly
        run: uvx pyrefly check

  test:
    name: Test (pytorch ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: 1.13.1
            tag: 1.13.1-cuda11.6-cudnn8-runtime
          - name: 2.1.2
            tag: 2.1.2-cuda12.1-cudnn8-runtime
          - name: 2.2.2
            tag: 2.2.2-cuda12.1-cudnn8-runtime
          - name: latest
            tag: latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >
          docker build
          -f docker/Dockerfile
          --build-arg PYTORCH_TAG=${{ matrix.tag }}
          -t flowc:${{ matrix.name }}
          .

      - name: Test with pytest
        run: >
          docker run --rm
          -v "$PWD:/out"
          flowc:${{ matrix.name }}
          pytest tests
          --cov=flowcon
          --cov-report=xml:/out/coverage.xml
          --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.name }}
          fail_ci_if_error: false
