name: Build, lint, and run tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Ruff
        run: uvx ruff@0.16.5 check flowcon tests examples

      - name: Ruff format
        run: uvx ruff@0.16.5 format --check

      - name: Pyrefly
        env:
          UV_TORCH_BACKEND: cpu
        run: uv run --extra datasets pyrefly check

  test:
    name: Test (pytorch ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: 2.13.0
            tag: 2.13.0-cuda12.6-cudnn9-runtime
          - name: latest
            tag: latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: >
          docker build
          -f docker/Dockerfile
          --build-arg PYTORCH_TAG=${{ matrix.tag }}
          -t flowc:${{ matrix.name }}
          .

      - name: Test with pytest
        run: >
          docker run --rm
          -v "$PWD:/out"
          flowc:${{ matrix.name }}
          pytest tests
          --cov=flowcon
          --cov-report=xml:/out/coverage.xml
          --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.name }}
          fail_ci_if_error: false
